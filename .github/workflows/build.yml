name: Build crack.dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'crack_dylib.m'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile crack.dylib
      run: |
        clang -arch arm64 \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -framework QuartzCore \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -target arm64-apple-ios14.0 \
          -undefined dynamic_lookup \
          -flat_namespace \
          -o crack.dylib crack_dylib.m

        echo "=== info ==="
        file crack.dylib
        otool -L crack.dylib

    - name: Upload crack.dylib
      uses: actions/upload-artifact@v4
      with:
        name: crack-dylib
        path: crack.dylib
        retention-days: 90
